<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Agadê Bases</title>
</head>
<body>
    <h1 class="title">Agadê Bases</h1>

    <form action="">

        <!--Formulário com os metadados p/ etl.bases-->
        <div class="container-form1">

            <label for="nome">nome:</label>
            <input type="text" id="nome">

            <label for="descricao">descricao:</label>
            <textarea id="descricao" rows="5" cols="30"></textarea>

            <label for="tabela_destino">tabela_destino:</label>
            <input type="text" id="tabela_destino">

            <label for="fonte">fonte:</label>
            <input type="text" id="fonte">

            <label for="fonte_link">fonte_link:</label>
            <input type="url" id="fonte_link">

            <label for="fonte_api">fonte_api:</label>
            <input type="url" id="fonte_api">
        </div>

        <!--Campo p/ chamar a API do CKAN-->
        <label for="input-url" class="container-form2">Url:</label>

        <div class="container-form2">
            <input type="url" id="input-url">
            <button type="button" id="bt-listar" class="btn">Listar package's</button>
        </div>

        <!--Caixa de busca-->
        <div class="busca-package" style="display: none;">
            <label for="input-busca-package">Buscar package:</label>
            <input type="text" id="input-busca-package">
        </div>

        <div id="lista-package-resource">
            <!--Campo p/ a lista de package e resources id-->
        </div>

        <!--Submeter o formulário e os resource's id selecionados-->
        <input type="submit" id="submit" class="container-form1 btn" value="Criar bases e fontes">
    </form>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
